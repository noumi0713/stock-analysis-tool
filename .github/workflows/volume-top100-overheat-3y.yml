name: Volume top100 overheat 3Y research

on:
  workflow_dispatch:
  push:
    branches:
      - research/volume-top100-overheat
    paths:
      - "research/volume_top100_overheat_3y.py"
      - "research/volume_top100_overheat_final_3y.py"
      - ".github/workflows/volume-top100-overheat-3y.yml"

permissions:
  contents: write

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out research branch
        uses: actions/checkout@v6

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Run three-year volume top100 overheat study
        run: |
          python research/volume_top100_overheat_3y.py
          python research/volume_top100_overheat_final_3y.py

      - name: Publish research result
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/results/volume_top100_overheat_3y/
          if git diff --cached --quiet; then
            echo "Research result unchanged."
            exit 0
          fi
          git commit -m "Add final 3y volume top100 overheat results"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
