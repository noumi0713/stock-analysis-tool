name: First pullback watch prototype check

on:
  workflow_dispatch:
  push:
    branches:
      - research/first-pullback-watch-prototype
    paths:
      - "research/first_pullback_watch_prototype.py"
      - "research/first_pullback_watch_ui.py"
      - "research/first_pullback_watch_prototype.md"
      - "research/build_theme_relevance_batch.py"
      - ".github/workflows/first-pullback-watch-prototype.yml"

permissions:
  contents: write

jobs:
  prototype-check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Run state-machine self-test
        run: python research/first_pullback_watch_prototype.py --self-test

      - name: Check UI syntax
        run: python -m py_compile research/first_pullback_watch_ui.py

      - name: Fetch 124-theme source branch
        run: git fetch origin research/volume-top100-overheat:refs/remotes/origin/research/volume-top100-overheat

      - name: Build first 300-stock relevance batch
        run: python research/build_theme_relevance_batch.py --batch 1 --size 300

      - name: Commit generated batch files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/results/theme_relevance_batches/batch_001_*.csv
          if git diff --cached --quiet; then
            echo "No batch changes"
          else
            git commit -m "Generate theme relevance batch 001"
            git push
          fi
