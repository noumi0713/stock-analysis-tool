name: 1570 morning high-low analysis

on:
  push:
    branches:
      - analysis/1570-am-20260918
    paths:
      - '.github/workflows/etf1570-am.yml'

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install yfinance==1.7.0 pandas>=2.2
      - name: Analyze completed morning sessions
        run: |
          python - <<'PY'
          import pandas as pd
          import yfinance as yf

          t = "1570.T"
          df = yf.Ticker(t).history(period="max", interval="1m", auto_adjust=False, prepost=False, actions=False)
          if df is None or df.empty:
              raise SystemExit("no data")

          idx = pd.DatetimeIndex(df.index)
          idx = idx.tz_localize("Asia/Tokyo") if idx.tz is None else idx.tz_convert("Asia/Tokyo")
          df = df.copy()
          df.index = idx

          am = df.between_time("09:00", "11:30", inclusive="both").copy()
          today = pd.Timestamp.now(tz="Asia/Tokyo").strftime("%Y-%m-%d")
          dates = [d for d in sorted(pd.Index(am.index.strftime("%Y-%m-%d")).unique()) if d < today][-5:]

          lowmins = []
          highmins = []
          print("Date,Low,LowTime,High,HighTime,Order")
          rows = []
          for d in dates:
              g = am[am.index.strftime("%Y-%m-%d") == d]
              if g.empty:
                  continue
              lows = pd.to_numeric(g["Low"], errors="coerce")
              highs = pd.to_numeric(g["High"], errors="coerce")
              lp = float(lows.min())
              hp = float(highs.max())
              lts = g.index[lows == lp][0]
              hts = g.index[highs == hp][0]
              lowmins.append(lts.hour * 60 + lts.minute)
              highmins.append(hts.hour * 60 + hts.minute)
              order = "LOW->HIGH" if lts < hts else ("HIGH->LOW" if hts < lts else "SAME_MINUTE")
              rows.append(order)
              print(f"{d},{lp},{lts.strftime('%H:%M')},{hp},{hts.strftime('%H:%M')},{order}")

          medl = int(pd.Series(lowmins).median())
          meanl = int(round(pd.Series(lowmins).mean()))
          medh = int(pd.Series(highmins).median())
          meanh = int(round(pd.Series(highmins).mean()))
          print(f"MedianLowTime={medl//60:02d}:{medl%60:02d}")
          print(f"MeanLowTime={meanl//60:02d}:{meanl%60:02d}")
          print(f"MedianHighTime={medh//60:02d}:{medh%60:02d}")
          print(f"MeanHighTime={meanh//60:02d}:{meanh%60:02d}")
          print("LowBeforeHigh="+str(sum(x=="LOW->HIGH" for x in rows)))
          print("HighBeforeLow="+str(sum(x=="HIGH->LOW" for x in rows)))
          PY
