name: IFIS first-pullback technical monitor

on:
  workflow_dispatch:
  push:
    branches:
      - research/first-pullback-watch-prototype
    paths:
      - research/first_pullback_watch_engine_v2.py
      - research/run_ifis_first_pullback_monitor.py
      - research/test_first_pullback_watch_engine_v2.py
      - research/test_run_ifis_first_pullback_monitor.py
      - research/combine_ifis_research_watch.py
      - research/test_combine_ifis_research_watch.py
      - research/results/ifis_theme_filter/candidate_news_reviewed.csv
      - .github/workflows/ifis-first-pullback-monitor.yml

permissions:
  contents: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Run monitor tests
        env:
          PYTHONPATH: research
        run: |
          python -m pip install --quiet pytest
          python -m pytest -q \
            research/test_first_pullback_watch_engine_v2.py \
            research/test_run_ifis_first_pullback_monitor.py \
            research/test_combine_ifis_research_watch.py

      - name: Run point-in-time technical monitor
        env:
          PYTHONPATH: research
        run: |
          test -f research/results/ifis_theme_filter/first_pullback_watch_candidates.json
          python research/run_ifis_first_pullback_monitor.py \
            --watch research/results/ifis_theme_filter/first_pullback_watch_candidates.json \
            --out research/results/ifis_theme_filter/technical_monitor.json

      - name: Combine semantic catalysts and technical state
        env:
          PYTHONPATH: research
        run: |
          test -f research/results/ifis_theme_filter/candidate_news_reviewed.csv
          python research/combine_ifis_research_watch.py \
            --review research/results/ifis_theme_filter/candidate_news_reviewed.csv \
            --technical research/results/ifis_theme_filter/technical_monitor.json \
            --out-dir research/results/ifis_theme_filter

      - name: Validate monitor output
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          tech = json.loads(Path('research/results/ifis_theme_filter/technical_monitor.json').read_text(encoding='utf-8'))
          final = json.loads(Path('research/results/ifis_theme_filter/research_watch_final.json').read_text(encoding='utf-8'))
          assert tech['status'] == 'complete'
          assert tech['candidate_count'] > 0
          assert tech['ok_count'] + tech['error_count'] == tech['candidate_count']
          assert final['status'] == 'complete'
          assert final['actionability'] == 'RESEARCH_ONLY'
          assert final['count'] == tech['candidate_count']
          print(json.dumps({
              'candidate_count': tech['candidate_count'],
              'ok_count': tech['ok_count'],
              'error_count': tech['error_count'],
              'disposition_counts': final['disposition_counts'],
              'final': [
                  {'rank': i['ifis_rank'], 'code': i['stock_code'], 'catalyst': i['catalyst_gate'], 'technical': i['technical_status'], 'disposition': i['research_disposition']}
                  for i in final['items']
              ],
          }, ensure_ascii=False, indent=2))
          PY

      - name: Commit research watch outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            research/results/ifis_theme_filter/technical_monitor.json \
            research/results/ifis_theme_filter/research_watch_final.json \
            research/results/ifis_theme_filter/research_watch_final.csv
          if git diff --cached --quiet; then
            echo "No output changes"
          else
            git commit -m "Update IFIS final research watch"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin HEAD:${GITHUB_REF_NAME}
          fi
