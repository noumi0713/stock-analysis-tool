name: Howa intraday high-low smoke test

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/howa-intraday-smoke.yml'

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: pip install yfinance==1.7.0 pandas>=2.2
      - name: Analyze
        run: |
          python - <<'PY'
          import pandas as pd
          import yfinance as yf

          t = "6203.T"
          df = yf.Ticker(t).history(period="max", interval="1m", auto_adjust=False, prepost=False, actions=False)
          if df is None or df.empty:
              raise SystemExit("no data")

          idx = pd.DatetimeIndex(df.index)
          idx = idx.tz_localize("Asia/Tokyo") if idx.tz is None else idx.tz_convert("Asia/Tokyo")
          df = df.copy()
          df.index = idx
          m = df.between_time("09:00", "11:30", inclusive="both").copy()
          dates = sorted(pd.Index(m.index.strftime("%Y-%m-%d")).unique())[-5:]

          rows = []
          low_mins = []
          high_mins = []
          for d in dates:
              g = m[m.index.strftime("%Y-%m-%d") == d]
              lows = pd.to_numeric(g["Low"], errors="coerce")
              highs = pd.to_numeric(g["High"], errors="coerce")
              lp = float(lows.min())
              hp = float(highs.max())
              lts = g.index[lows == lp][0]
              hts = g.index[highs == hp][0]
              low_mins.append(lts.hour * 60 + lts.minute)
              high_mins.append(hts.hour * 60 + hts.minute)
              if lts < hts:
                  order = "LOW->HIGH"
              elif hts < lts:
                  order = "HIGH->LOW"
              else:
                  order = "SAME_MINUTE"
              rows.append({
                  "Ticker": t,
                  "Date": d,
                  "Low": lp,
                  "LowTime": lts.strftime("%H:%M"),
                  "High": hp,
                  "HighTime": hts.strftime("%H:%M"),
                  "Order": order,
              })

          daily = pd.DataFrame(rows)
          print("=== DAILY ===")
          print(daily.to_csv(index=False))

          med_low = int(pd.Series(low_mins).median())
          mean_low = int(round(pd.Series(low_mins).mean()))
          med_high = int(pd.Series(high_mins).median())
          mean_high = int(round(pd.Series(high_mins).mean()))
          low_before = sum(r["Order"] == "LOW->HIGH" for r in rows)
          high_before = sum(r["Order"] == "HIGH->LOW" for r in rows)
          print("=== SUMMARY ===")
          print(f"MedianLowTime={med_low//60:02d}:{med_low%60:02d}")
          print(f"MeanLowTime={mean_low//60:02d}:{mean_low%60:02d}")
          print(f"MedianHighTime={med_high//60:02d}:{med_high%60:02d}")
          print(f"MeanHighTime={mean_high//60:02d}:{mean_high%60:02d}")
          print(f"LowBeforeHigh={low_before}")
          print(f"HighBeforeLow={high_before}")
          PY
