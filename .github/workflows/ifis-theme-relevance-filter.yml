name: IFIS theme relevance filter

on:
  workflow_dispatch:
    inputs:
      input_path:
        description: Manual IFIS CSV path in the repository
        required: true
        default: research/data/ifis_manual_input_sample.csv

permissions:
  contents: write

jobs:
  filter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Run unit tests
        env:
          PYTHONPATH: research
        run: |
          python -m pip install --quiet pytest
          python -m pytest -q research/test_ifis_theme_relevance_filter.py

      - name: Join manual IFIS candidates to finalized theme master
        env:
          INPUT_PATH: ${{ inputs.input_path }}
        run: |
          test -f "$INPUT_PATH"
          python research/ifis_theme_relevance_filter.py \
            --input "$INPUT_PATH" \
            --master research/results/theme_relevance_batches/theme_relevance_full_final.csv \
            --out-dir research/results/ifis_theme_filter

      - name: Validate outputs
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('research/results/ifis_theme_filter/latest_summary.json')
          s = json.loads(p.read_text(encoding='utf-8'))
          assert s['status'] == 'complete'
          assert s['candidate_count'] > 0
          assert s['mapped_candidates'] + s['unmapped_candidates'] == s['candidate_count']
          print(json.dumps(s, ensure_ascii=False, indent=2))
          PY

      - name: Commit research outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/results/ifis_theme_filter
          if git diff --cached --quiet; then
            echo "No output changes"
          else
            git commit -m "Update IFIS theme relevance filter outputs"
            git push origin HEAD:${{ github.ref_name }}
          fi
