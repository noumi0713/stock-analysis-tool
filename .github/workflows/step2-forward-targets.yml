name: step2-forward-targets

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/step2-forward-targets.yml'
      - 'momentum5d/scripts/build_step2_targets.py'
  workflow_dispatch:
  workflow_run:
    workflows: [step1-equity-features]
    types: [completed]

permissions:
  contents: read
  actions: read

concurrency:
  group: step2-forward-targets
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    defaults:
      run:
        working-directory: momentum5d
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: momentum5d/pyproject.toml

      - name: Install dependencies
        run: pip install -e .

      - name: Restore certified STEP1 input
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p data/market_history
          run_id=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow step1-equity-features.yml --status success -L 1 --json databaseId --jq '.[0].databaseId // empty')
          test -n "$run_id"
          gh run download "$run_id" --repo "$GITHUB_REPOSITORY" -n step1-equity-features -D data/market_history
          test -f data/market_history/quality/step1_report.json
          test "$(python -c 'import json; print(json.load(open("data/market_history/quality/step1_report.json"))["quality"])')" = PASS

      - name: Build STEP2 forward targets
        id: step2
        continue-on-error: true
        env:
          PYTHONUNBUFFERED: '1'
        run: python scripts/build_step2_targets.py

      - name: Upload STEP2 certified artifact
        if: steps.step2.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: step2-forward-targets
          path: |
            momentum5d/data/market_history/targets/equity_daily_forward_targets/
            momentum5d/data/market_history/quality/step2_report.json
            momentum5d/data/market_history/quality/STEP3_PROMPT.md
          retention-days: 90
          compression-level: 0
          if-no-files-found: error

      - name: Upload STEP2 failure evidence
        if: steps.step2.outcome != 'success'
        uses: actions/upload-artifact@v4
        with:
          name: step2-failed-${{ github.run_id }}
          path: momentum5d/data/market_history/quality/
          retention-days: 30
          if-no-files-found: warn

      - name: Enforce STEP2 quality gate
        if: steps.step2.outcome != 'success'
        run: exit 1
