name: step4-common-features

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/step4-common-features.yml'
      - 'momentum5d/scripts/build_step4_common_features.py'
      - 'momentum5d/pyproject.toml'
  workflow_dispatch:
  workflow_run:
    workflows: [step3-large-move-events]
    types: [completed]

permissions:
  contents: read
  actions: read

concurrency:
  group: step4-common-features
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    defaults:
      run:
        working-directory: momentum5d
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: momentum5d/pyproject.toml
      - name: Install dependencies
        run: pip install -e . 'matplotlib>=3.9,<4'
      - name: Restore certified STEP1 and STEP3 inputs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p data/market_history
          step1_run=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow step1-equity-features.yml --status success -L 1 --json databaseId --jq '.[0].databaseId // empty')
          step3_run=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow step3-large-move-events.yml --status success -L 1 --json databaseId --jq '.[0].databaseId // empty')
          test -n "$step1_run"
          test -n "$step3_run"
          gh run download "$step1_run" --repo "$GITHUB_REPOSITORY" -n step1-equity-features -D data/market_history
          gh run download "$step3_run" --repo "$GITHUB_REPOSITORY" -n step3-large-move-events -D data/market_history
          test "$(python -c 'import json; print(json.load(open("data/market_history/quality/step1_report.json"))["quality"])')" = PASS
          test "$(python -c 'import json; print(json.load(open("data/market_history/quality/step3_report.json"))["quality"])')" = PASS
      - name: Build STEP4 common-feature analysis
        id: step4
        continue-on-error: true
        env:
          PYTHONUNBUFFERED: '1'
        run: python scripts/build_step4_common_features.py
      - name: Upload STEP4 certified artifact
        if: steps.step4.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: step4-common-features
          path: |
            momentum5d/data/market_history/analysis/step4_pre_event_common_features/
            momentum5d/data/market_history/quality/step4_report.json
            momentum5d/data/market_history/quality/STEP5_PROMPT.md
          retention-days: 90
          compression-level: 0
          if-no-files-found: error
      - name: Upload STEP4 failure evidence
        if: steps.step4.outcome != 'success'
        uses: actions/upload-artifact@v4
        with:
          name: step4-failed-${{ github.run_id }}
          path: momentum5d/data/market_history/quality/
          retention-days: 30
          if-no-files-found: warn
      - name: Enforce STEP4 quality gate
        if: steps.step4.outcome != 'success'
        run: exit 1
