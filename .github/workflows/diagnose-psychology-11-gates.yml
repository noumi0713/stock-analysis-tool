name: Diagnose psychology 11 gates

on:
  push:
    branches:
      - research/crowd-psychology-3y-backtest
    paths:
      - "momentum5d/scripts/diagnose_psychology_11_gates.py"
      - ".github/workflows/diagnose-psychology-11-gates.yml"
      - "dashboard-data/technical-backtest-3y/**"
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check pandas numpy
      - name: Diagnose gates
        run: |
          mkdir -p research-output
          python momentum5d/scripts/diagnose_psychology_11_gates.py \
            --data-dir dashboard-data/technical-backtest-3y \
            --output-json research-output/psychology-11-gate-diagnostics.json \
            --output-md research-output/psychology-11-gate-diagnostics.md
      - name: Show diagnostics
        if: always()
        run: |
          if [ -f research-output/psychology-11-gate-diagnostics.md ]; then
            cat research-output/psychology-11-gate-diagnostics.md
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: psychology-11-gate-diagnostics
          path: research-output/
          if-no-files-found: warn
