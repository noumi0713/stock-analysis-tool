name: 日本株週次全銘柄コンセンサス

on:
  workflow_dispatch:
  schedule:
    # Saturday 10:00 JST. Uses the latest published JPX universe and stores a weekly snapshot.
    - cron: '0 1 * * 6'

permissions:
  contents: write

concurrency:
  group: swing-data-publication
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 80
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: swing_data/requirements.txt
      - run: python -m pip install -r swing_data/requirements.txt
      - name: Restore latest JPX universe
        run: |
          git fetch origin swing-data-120d-latest
          mkdir -p weekly-input
          git show FETCH_HEAD:universe.csv > weekly-input/universe.csv
      - name: Collect one Yahoo consensus shard
        env:
          PYTHONUNBUFFERED: '1'
        run: |
          mkdir -p weekly-output
          python -m swing_data.weekly_consensus collect \
            --universe weekly-input/universe.csv \
            --output weekly-output/shard-${{ matrix.shard }}.csv \
            --shard-index ${{ matrix.shard }} \
            --shard-count 6 \
            --max-workers 2
      - uses: actions/upload-artifact@v4
        with:
          name: weekly-consensus-shard-${{ matrix.shard }}
          path: weekly-output/shard-${{ matrix.shard }}.csv
          retention-days: 7
          if-no-files-found: error

  merge-and-publish:
    needs: collect
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: swing_data/requirements.txt
      - run: python -m pip install -r swing_data/requirements.txt
      - uses: actions/download-artifact@v4
        with:
          pattern: weekly-consensus-shard-*
          path: weekly-shards
          merge-multiple: true
      - name: Restore published data branch
        run: |
          git fetch origin swing-data-120d-latest
          git worktree add --detach public-data FETCH_HEAD

      # Licensed providers are not scraped from public web pages. Set these
      # repository secrets only after obtaining the appropriate vendor license.
      # Each URL must return the normalized CSV schema documented in
      # swing_data/licensed_consensus.py. AUTH_HEADER is optional and should
      # contain the complete header value, e.g. "Authorization: Bearer ...".
      - name: Fetch licensed IFIS and QUICK normalized feeds
        env:
          IFIS_FEED_URL: ${{ secrets.IFIS_CONSENSUS_NORMALIZED_URL }}
          IFIS_AUTH_HEADER: ${{ secrets.IFIS_CONSENSUS_AUTH_HEADER }}
          QUICK_FEED_URL: ${{ secrets.QUICK_TARGET_NORMALIZED_URL }}
          QUICK_AUTH_HEADER: ${{ secrets.QUICK_TARGET_AUTH_HEADER }}
        run: |
          mkdir -p licensed-inputs
          fetch_optional() {
            name="$1"; url="$2"; auth="$3"
            if [ -z "$url" ]; then
              echo "$name feed not configured; leaving it missing."
              return 0
            fi
            if [ -n "$auth" ]; then
              curl --retry 3 --retry-all-errors -fsSL -H "$auth" "$url" -o "licensed-inputs/$name.csv"
            else
              curl --retry 3 --retry-all-errors -fsSL "$url" -o "licensed-inputs/$name.csv"
            fi
          }
          fetch_optional ifis "$IFIS_FEED_URL" "$IFIS_AUTH_HEADER"
          fetch_optional quick "$QUICK_FEED_URL" "$QUICK_AUTH_HEADER"

      - name: Merge weekly three-source snapshot
        env:
          PYTHONUNBUFFERED: '1'
        run: |
          args=(
            --universe public-data/universe.csv
            --shards weekly-shards
            --target public-data
          )
          if [ -s licensed-inputs/ifis.csv ]; then args+=(--ifis licensed-inputs/ifis.csv); fi
          if [ -s licensed-inputs/quick.csv ]; then args+=(--quick licensed-inputs/quick.csv); fi
          python -m swing_data.weekly_consensus merge "${args[@]}"

      - name: Publish weekly consensus history
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd public-data
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add weekly_consensus weekly_consensus_latest.csv weekly_consensus_status.json
          if git diff --cached --quiet; then
            echo 'No weekly consensus changes.'
            exit 0
          fi
          git commit -m 'Publish weekly full-universe three-source consensus snapshot'
          git -c "http.extraHeader=AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)" \
            push origin HEAD:swing-data-120d-latest
