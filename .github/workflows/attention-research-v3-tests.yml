name: Attention research v3 tests

on:
  push:
    branches:
      - research/first-pullback-watch-prototype
    paths:
      - research/attention_discovery_stage.py
      - research/prepare_attention_watch.py
      - research/material_attention_classifier.py
      - research/run_attention_technical_monitor.py
      - research/final_attention_entry_classifier.py
      - research/test_attention_research_pipeline_v3.py
      - research/ATTENTION_RESEARCH_PIPELINE_V3.md
      - .github/workflows/attention-research-v3-tests.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Compile research modules
        run: |
          python -m py_compile \
            research/attention_discovery_stage.py \
            research/prepare_attention_watch.py \
            research/material_attention_classifier.py \
            research/run_attention_technical_monitor.py \
            research/final_attention_entry_classifier.py
      - name: Run v3 unit tests
        env:
          PYTHONPATH: research
        run: |
          python -m pip install --quiet pytest
          python -m pytest -q research/test_attention_research_pipeline_v3.py
      - name: Record passing research test status
        run: |
          mkdir -p research/results/attention_research_v3
          python - <<'PY'
          import json, os
          from datetime import datetime, timezone
          from pathlib import Path
          payload = {
              'status': 'passed',
              'workflow': 'attention-research-v3-tests.yml',
              'tested_commit': os.environ['GITHUB_SHA'],
              'tested_at_utc': datetime.now(timezone.utc).isoformat(),
              'scope': 'RESEARCH_ONLY',
          }
          Path('research/results/attention_research_v3/test_status.json').write_text(
              json.dumps(payload, ensure_ascii=False, indent=2), encoding='utf-8'
          )
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/results/attention_research_v3/test_status.json
          git commit -m "Record attention research v3 test pass"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin HEAD:${GITHUB_REF_NAME}
