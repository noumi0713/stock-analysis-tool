name: Theme relevance score v2

on:
  workflow_dispatch:
  push:
    branches:
      - research/first-pullback-watch-prototype
    paths:
      - "research/score_theme_relevance.py"
      - "research/score_theme_relevance_v2.py"
      - "research/finalize_theme_relevance_batch.py"
      - "research/results/theme_relevance_batches/batch_001_manual_overrides.csv"
      - ".github/workflows/theme-relevance-score-v2.yml"

permissions:
  contents: write

jobs:
  score:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Score batch 001 with calibrated v2
        run: python research/score_theme_relevance_v2.py --batch 1
      - name: Apply official-IR QA overrides
        run: python research/finalize_theme_relevance_batch.py --batch 1
      - name: Commit reviewed scores
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/results/theme_relevance_batches/batch_001_scores_v2.csv research/results/theme_relevance_batches/batch_001_score_summary_v2.json research/results/theme_relevance_batches/batch_001_scores_reviewed.csv research/results/theme_relevance_batches/batch_001_reviewed_summary.json
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Finalize reviewed theme relevance batch 001"
            git pull --rebase origin research/first-pullback-watch-prototype
            git push
          fi
