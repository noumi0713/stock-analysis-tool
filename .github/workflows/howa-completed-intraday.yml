name: Howa completed-session intraday test

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/howa-completed-intraday.yml'

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install yfinance==1.7.0 pandas>=2.2
      - name: Analyze completed sessions
        run: |
          python - <<'PY'
          import pandas as pd
          import yfinance as yf
          t="6203.T"
          df=yf.Ticker(t).history(period="max",interval="1m",auto_adjust=False,prepost=False,actions=False)
          idx=pd.DatetimeIndex(df.index)
          idx=idx.tz_localize("Asia/Tokyo") if idx.tz is None else idx.tz_convert("Asia/Tokyo")
          df=df.copy(); df.index=idx
          m=df.between_time("09:00","11:30",inclusive="both").copy()
          today=pd.Timestamp.now(tz="Asia/Tokyo").strftime("%Y-%m-%d")
          dates=[d for d in sorted(pd.Index(m.index.strftime("%Y-%m-%d")).unique()) if d<today][-5:]
          rows=[]; lm=[]; hm=[]
          for d in dates:
              g=m[m.index.strftime("%Y-%m-%d")==d]
              lows=pd.to_numeric(g["Low"],errors="coerce"); highs=pd.to_numeric(g["High"],errors="coerce")
              lp=float(lows.min()); hp=float(highs.max())
              lts=g.index[lows==lp][0]; hts=g.index[highs==hp][0]
              lm.append(lts.hour*60+lts.minute); hm.append(hts.hour*60+hts.minute)
              order="LOW->HIGH" if lts<hts else ("HIGH->LOW" if hts<lts else "SAME_MINUTE")
              rows.append([d,lp,lts.strftime("%H:%M"),hp,hts.strftime("%H:%M"),order])
          print("Date,Low,LowTime,High,HighTime,Order")
          for r in rows: print(",".join(map(str,r)))
          medl=int(pd.Series(lm).median()); meanl=int(round(pd.Series(lm).mean()))
          medh=int(pd.Series(hm).median()); meanh=int(round(pd.Series(hm).mean()))
          print(f"MedianLow={medl//60:02d}:{medl%60:02d}")
          print(f"MeanLow={meanl//60:02d}:{meanl%60:02d}")
          print(f"MedianHigh={medh//60:02d}:{medh%60:02d}")
          print(f"MeanHigh={meanh//60:02d}:{meanh%60:02d}")
          print("LowBeforeHigh="+str(sum(r[5]=="LOW->HIGH" for r in rows)))
          print("HighBeforeLow="+str(sum(r[5]=="HIGH->LOW" for r in rows)))
          PY
