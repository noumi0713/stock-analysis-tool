name: bottom-pullback-distortions-v1
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/bottom-pullback-distortions-v1.yml'
      - 'momentum5d/scripts/bottom_pullback_distortions.py'
      - 'momentum5d/tests/test_bottom_pullback_distortions.py'
      - 'momentum5d/research/BOTTOM_PULLBACK_DISTORTIONS_NEXT_PROMPT.md'
permissions:
  contents: read
  actions: read
concurrency:
  group: bottom-pullback-distortions-v1-${{ github.ref }}
  cancel-in-progress: false
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: momentum5d
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install research dependencies
        run: pip install 'numpy<3' 'pandas>=2.2,<3' 'pyarrow>=18,<22' 'duckdb>=1.2,<2' 'pytest>=8.3,<9' 'python-dotenv>=1,<2' tabulate
      - name: Test causal joins, purging, fixed training boundaries and missingness
        run: python -m pytest -q tests/test_bottom_pullback_distortions.py
      - name: Restore pinned originals and independently run formation research twice
        env:
          GH_TOKEN: ${{ github.token }}
          PYTHONUNBUFFERED: '1'
        run: python scripts/bottom_pullback_distortions.py --restore
      - name: Save research and quality including failure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bottom-pullback-distortions-v1
          path: |
            momentum5d/data/market_history/analysis/bottom_pullback_distortions_v1/run_1/
            momentum5d/data/market_history/analysis/bottom_pullback_distortions_v1/quality/
          if-no-files-found: warn
          retention-days: 90
