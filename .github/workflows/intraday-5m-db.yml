name: Intraday 5-minute database

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/intraday-5m-db.yml'
  workflow_dispatch:
    inputs:
      lookback_days:
        description: "Calendar days to backfill (1-59; default 59)"
        required: false
        default: "59"
  schedule:
    - cron: '15 19 * * 0-4' # 04:15 JST, bootstrap only while the data branch is absent
    - cron: '45 7 * * 1-5' # 16:45 JST, after the Tokyo close

permissions:
  contents: write

concurrency:
  group: intraday-5m-db
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: swing_data/requirements.txt
      - run: pip install -r swing_data/requirements.txt

      - name: Restore last permanent snapshot if present
        id: restore
        env:
          EARLY_BOOTSTRAP: ${{ github.event.schedule == '15 19 * * 0-4' }}
        run: |
          if git fetch origin refs/heads/intraday-5m-data:refs/remotes/origin/intraday-5m-data; then
            if [ "$EARLY_BOOTSTRAP" = true ]; then
              echo 'skip=true' >> "$GITHUB_OUTPUT"
              exit 0
            fi
            git show origin/intraday-5m-data:intraday_5m.sqlite > "$RUNNER_TEMP/intraday_5m.sqlite"
          else
            echo 'BOOTSTRAP=1' >> "$GITHUB_ENV"
          fi

      - name: Collect completed sessions
        if: steps.restore.outputs.skip != 'true'
        env:
          LOOKBACK_DAYS: ${{ inputs.lookback_days }}
        run: |
          if [ -z "$LOOKBACK_DAYS" ]; then
            if [ "$BOOTSTRAP" = 1 ] || [ "${{ github.event_name }}" = push ]; then
              LOOKBACK_DAYS=59
            else
              LOOKBACK_DAYS=7
            fi
          fi
          python -m swing_data.intraday_5m_db \
            --db "$RUNNER_TEMP/intraday_5m.sqlite" \
            --report "$RUNNER_TEMP/intraday_5m_report.json" \
            --lookback-days "$LOOKBACK_DAYS" \
            --include-today

      - name: Audit coverage and consistency
        if: steps.restore.outputs.skip != 'true'
        run: |
          python -m swing_data.intraday_5m_quality \
            --db "$RUNNER_TEMP/intraday_5m.sqlite" \
            --report "$RUNNER_TEMP/intraday_5m_quality.json"

      - name: Publish latest validated snapshot
        if: steps.restore.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/intraday-5m-publish"
          cd "$RUNNER_TEMP/intraday-5m-publish"
          cp "$RUNNER_TEMP/intraday_5m.sqlite" .
          cp "$RUNNER_TEMP/intraday_5m_report.json" .
          cp "$RUNNER_TEMP/intraday_5m_quality.json" .
          printf '# Intraday 5-minute database\n\nLatest SQLite snapshot. See intraday_5m_report.json for collection results.\n' > README.md
          git init -b intraday-5m-data
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git add README.md intraday_5m.sqlite intraday_5m_report.json intraday_5m_quality.json
          git commit -m 'Publish 5-minute database snapshot'
          git -c "http.extraHeader=AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)" \
            push --force origin HEAD:intraday-5m-data

      - name: Upload diagnostic report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: intraday-5m-failed-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/intraday_5m_report.json
            ${{ runner.temp }}/intraday_5m_quality.json
          if-no-files-found: ignore
