name: guarded-repository-cleanup

on:
  push:
    branches: [main]
    paths:
      - '.cleanup/execute'

permissions:
  contents: write
  actions: read

concurrency:
  group: guarded-repository-cleanup
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Fetch preserved data and 120-day source code
        run: |
          git fetch origin \
            swing-data-120d-latest:refs/remotes/origin/swing-data-120d-latest \
            technical-data-7y:refs/remotes/origin/technical-data-7y \
            feature/swing-120d-data:refs/remotes/origin/feature/swing-120d-data

      - name: Safety gate - verify preserved datasets before deletion
        run: |
          git show refs/remotes/origin/technical-data-7y:manifest.json > /tmp/technical_manifest.json
          git show refs/remotes/origin/swing-data-120d-latest:manifest.json > /tmp/swing_manifest.json
          python - <<'PY'
          import datetime as dt
          import json

          tech = json.load(open('/tmp/technical_manifest.json', encoding='utf-8'))
          swing = json.load(open('/tmp/swing_manifest.json', encoding='utf-8'))

          if tech.get('quality') != 'PASS':
              raise SystemExit('ABORT: technical-data-7y is not PASS')
          period = tech.get('period') or {}
          oldest = dt.date.fromisoformat(period['oldest'])
          latest = dt.date.fromisoformat(period['latest'])
          span = (latest - oldest).days
          if span < 365 * 6 + 300:
              raise SystemExit(f'ABORT: technical history is too short: {oldest}..{latest}')
          if int(tech.get('tickers') or 0) < 3000:
              raise SystemExit('ABORT: technical dataset has fewer than 3000 tickers')
          if int(tech.get('feature_count') or 0) < 100:
              raise SystemExit('ABORT: technical dataset feature count is unexpectedly low')
          files = tech.get('files') or []
          if not files:
              raise SystemExit('ABORT: technical dataset manifest has no shards')

          if int(swing.get('window_sessions') or 0) != 120:
              raise SystemExit('ABORT: 120-day snapshot does not contain 120 sessions')
          if int(swing.get('ready_count') or 0) < 3000:
              raise SystemExit('ABORT: 120-day snapshot ready_count is too low')
          if swing.get('market_quality') != 'PASS':
              raise SystemExit('ABORT: 120-day market data quality is not PASS')
          if swing.get('required_market_failures'):
              raise SystemExit('ABORT: 120-day snapshot has required market failures')

          print(json.dumps({
              'technical_period': [str(oldest), str(latest)],
              'technical_span_days': span,
              'technical_tickers': tech.get('tickers'),
              'technical_features': tech.get('feature_count'),
              'technical_shards': len(files),
              'swing_ready_count': swing.get('ready_count'),
              'swing_market_quality': swing.get('market_quality'),
          }, ensure_ascii=False, indent=2))
          PY

      - name: Build minimal clean main tree
        run: |
          rm -rf clean-main
          mkdir -p clean-main/.github/workflows clean-main/momentum5d/scripts clean-main/momentum5d/config

          # Keep the complete 120-day collector, its configs, and its tests.
          git archive refs/remotes/origin/feature/swing-120d-data swing_data tests/swing_data | tar -x -C clean-main
          git show refs/remotes/origin/feature/swing-120d-data:.github/workflows/swing-data-120d.yml > clean-main/.github/workflows/swing-data-120d.yml
          sed -i 's/branches: \[feature\/swing-120d-data\]/branches: [main]/' clean-main/.github/workflows/swing-data-120d.yml
          sed -i 's/ref: feature\/swing-120d-data/ref: main/' clean-main/.github/workflows/swing-data-120d.yml

          # Keep only the long-term raw collector and STEP1 technical feature builder.
          cp momentum5d/scripts/build_market_history.py clean-main/momentum5d/scripts/
          cp momentum5d/scripts/build_step1_features.py clean-main/momentum5d/scripts/
          cp momentum5d/config/market_history_tickers.json clean-main/momentum5d/config/
          sed -i 's/eq_start = asof - timedelta(days=366 \* 5 + 15)/eq_start = asof - timedelta(days=366 * 7 + 15)/' clean-main/momentum5d/scripts/build_market_history.py

          cat > clean-main/momentum5d/requirements.txt <<'EOF'
          duckdb>=1.2,<2
          numpy>=1.26
          pandas>=2.2,<3
          pyarrow>=18,<22
          yfinance>=1.5.1,<2
          EOF

          # Preserve the hardened STEP1 publication workflow, but make it
          # independent of the deleted Momentum application package.
          cp .github/workflows/step1-equity-features.yml clean-main/.github/workflows/step1-equity-features.yml
          sed -i 's#cache-dependency-path: momentum5d/pyproject.toml#cache-dependency-path: momentum5d/requirements.txt#' clean-main/.github/workflows/step1-equity-features.yml
          sed -i 's#run: pip install -e \.#run: pip install -r requirements.txt#' clean-main/.github/workflows/step1-equity-features.yml

          cat > clean-main/.github/workflows/market-history-data.yml <<'EOF'
          name: market-history-data

          on:
            workflow_dispatch:
              inputs:
                mode:
                  description: bootstrap or update
                  required: true
                  default: update
                  type: choice
                  options: [update, bootstrap]
            schedule:
              - cron: '30 9 * * 1-5'

          permissions:
            contents: read
            actions: read

          concurrency:
            group: market-history-data
            cancel-in-progress: false

          jobs:
            build:
              runs-on: ubuntu-latest
              timeout-minutes: 330
              defaults:
                run:
                  working-directory: momentum5d
              steps:
                - uses: actions/checkout@v4

                - uses: actions/setup-python@v5
                  with:
                    python-version: '3.12'
                    cache: pip
                    cache-dependency-path: momentum5d/requirements.txt

                - name: Install dependencies
                  run: pip install -r requirements.txt

                - name: Restore prior certified dataset for incremental update
                  if: github.event_name == 'schedule' || inputs.mode == 'update'
                  env:
                    GH_TOKEN: __GITHUB_TOKEN_EXPR__
                  run: |
                    mkdir -p data/market_history
                    run_id=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow market-history-data.yml --status success -L 1 --json databaseId --jq '.[0].databaseId // empty')
                    if [ -n "$run_id" ]; then
                      gh run download "$run_id" --repo "$GITHUB_REPOSITORY" -n market-history-certified -D data/market_history || true
                    fi

                - name: Prepare current TSE universe from preserved 120-day data
                  run: |
                    mkdir -p data
                    git fetch origin swing-data-120d-latest
                    git show FETCH_HEAD:universe.csv > data/universe_source.csv
                    python - <<'PY'
                    import pandas as pd
                    p='data/universe_source.csv'
                    df=pd.read_csv(p,dtype=str)
                    required={'ticker','company_name','sector17'}
                    missing=required-set(df.columns)
                    if missing:
                        raise SystemExit(f'missing universe columns: {sorted(missing)}')
                    out=df[['ticker','company_name','sector17']].rename(columns={'company_name':'name','sector17':'sector'})
                    out=out.dropna(subset=['ticker']).drop_duplicates('ticker').sort_values('ticker')
                    if len(out)<3000:
                        raise SystemExit(f'universe too small: {len(out)}')
                    out.to_csv('data/tse_universe.csv',index=False)
                    print({'tickers':len(out)})
                    PY

                - name: Build and quality-check seven-year history
                  id: build
                  continue-on-error: true
                  env:
                    PYTHONUNBUFFERED: '1'
                  run: |
                    mode='__INPUT_MODE_EXPR__'
                    if [ -z "$mode" ]; then mode=update; fi
                    if [ "$mode" = update ] && [ ! -d data/market_history/raw/equities ]; then mode=bootstrap; fi
                    python scripts/build_market_history.py --mode "$mode" --universe-file data/tse_universe.csv --batch-size 150

                - name: Upload certified dataset
                  if: steps.build.outcome == 'success'
                  uses: actions/upload-artifact@v4
                  with:
                    name: market-history-certified
                    path: momentum5d/data/market_history/
                    retention-days: 90
                    compression-level: 6
                    if-no-files-found: error

                - name: Upload failure evidence
                  if: steps.build.outcome != 'success'
                  uses: actions/upload-artifact@v4
                  with:
                    name: market-history-failed-__RUN_ID_EXPR__
                    path: momentum5d/data/market_history/
                    retention-days: 30
                    compression-level: 6
                    if-no-files-found: warn

                - name: Enforce quality gate
                  if: steps.build.outcome != 'success'
                  run: exit 1
          EOF
          python - <<'PY'
          from pathlib import Path
          p = Path('clean-main/.github/workflows/market-history-data.yml')
          s = p.read_text(encoding='utf-8')
          dollar = '$'
          s = s.replace('__GITHUB_TOKEN_EXPR__', dollar + '{{ github.token }}')
          s = s.replace('__INPUT_MODE_EXPR__', dollar + '{{ inputs.mode }}')
          s = s.replace('__RUN_ID_EXPR__', dollar + '{{ github.run_id }}')
          p.write_text(s, encoding='utf-8')
          PY

          cat > clean-main/README.md <<'EOF'
          # stock-analysis-tool

          This repository is intentionally reduced to two retained data assets:

          1. `swing-data-120d-latest` — the current 120-session site/data snapshot.
          2. `technical-data-7y` — the certified seven-year technical feature dataset.

          `main` contains only the collectors, quality checks, publication workflows and tests required to maintain those assets. Legacy sites, research branches and historical backtest outputs were removed intentionally.
          EOF

          find clean-main -maxdepth 4 -type f | sort

      - name: Validate clean main before force replacement
        run: |
          python -m pip install -r clean-main/swing_data/requirements.txt pytest
          PYTHONPATH=clean-main python -m pytest clean-main/tests/swing_data -q
          python -m py_compile \
            clean-main/momentum5d/scripts/build_market_history.py \
            clean-main/momentum5d/scripts/build_step1_features.py
          grep -F 'eq_start = asof - timedelta(days=366 * 7 + 15)' clean-main/momentum5d/scripts/build_market_history.py
          grep -F 'ref: main' clean-main/.github/workflows/swing-data-120d.yml
          grep -F '${{ github.token }}' clean-main/.github/workflows/market-history-data.yml
          if grep -R -F 'feature/swing-120d-data' clean-main/.github/workflows; then
            echo 'clean workflows still reference deleted source branch'
            exit 1
          fi

      - name: Replace main with clean root commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd clean-main
          git init -b main
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git add --all
          git commit -m 'Reset repository to retained 120-day and 7-year data infrastructure'
          git -c "http.extraHeader=AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)" push --force origin HEAD:main

      - name: Delete obsolete branches
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          auth="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          failures=0
          while read -r branch; do
            case "$branch" in
              main|swing-data-120d-latest|technical-data-7y) continue ;;
            esac
            echo "Deleting obsolete branch: $branch"
            if ! git -c "http.extraHeader=$auth" push origin --delete "$branch"; then
              echo "Could not delete $branch"
              failures=$((failures+1))
            fi
          done < <(git ls-remote --heads origin | sed 's#.*refs/heads/##' | sort)
          echo "branch_delete_failures=$failures"
