name: bottom-pullback-hit-rates-v2
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/bottom-pullback-hit-rates-v2.yml'
      - 'momentum5d/scripts/bottom_pullback_hit_rates.py'
      - 'momentum5d/tests/test_bottom_pullback_hit_rates.py'
permissions:
  contents: read
  actions: read
concurrency:
  group: bottom-pullback-hit-rates-v2-${{ github.ref }}
  cancel-in-progress: false
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    defaults:
      run:
        working-directory: momentum5d
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install research dependencies
        run: pip install numpy pandas pyarrow duckdb pytest tabulate
      - name: Test causal detection and split-boundary invariants
        run: python -m pytest -q tests/test_bottom_pullback_hit_rates.py
      - name: Restore original, run halves sequentially, verify independent rerun
        env:
          GH_TOKEN: ${{ github.token }}
          PYTHONUNBUFFERED: '1'
        run: python scripts/bottom_pullback_hit_rates.py --restore
      - name: Save research outcomes and quality
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bottom-pullback-hit-rates-v2
          path: |
            momentum5d/data/bottom_pullback_hit_rates_v2/run_1/**/*.parquet
            momentum5d/data/bottom_pullback_hit_rates_v2/quality/
          if-no-files-found: warn
          retention-days: 90
      - name: Save first chronological price half
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: bottom-pullback-certified-price-half-1
          path: momentum5d/data/bottom_pullback_hit_rates_v2/halves/half_1.parquet
          retention-days: 90
      - name: Save second chronological price half
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: bottom-pullback-certified-price-half-2
          path: momentum5d/data/bottom_pullback_hit_rates_v2/halves/half_2.parquet
          retention-days: 90
