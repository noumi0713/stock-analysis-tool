name: step10-v2-exit-analysis

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/step10-v2-exit-analysis.yml'
      - 'momentum5d/scripts/build_step10_v2.py'
      - 'momentum5d/scripts/step10_certification_gate.py'
      - 'momentum5d/scripts/restore_step10_certified_inputs.py'
      - 'momentum5d/tests/test_step10_v2.py'
      - 'momentum5d/tests/test_step10_certification_gate.py'

permissions:
  contents: read
  actions: read

concurrency:
  group: step10-v2-exit-analysis
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    defaults:
      run:
        working-directory: momentum5d
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: momentum5d/pyproject.toml
      - name: Install dependencies
        run: pip install -e . pytest
      - name: Test STEP10 V2 invariants
        run: pytest -q tests/test_step10_v2.py tests/test_step10_certification_gate.py
      - name: Restore pinned certified STEP1, STEP7 V2, and STEP9 V2 inputs
        id: restore
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/restore_step10_certified_inputs.py
      - name: Build STEP10 V2 only
        id: step10v2
        if: steps.restore.outcome == 'success'
        continue-on-error: true
        env:
          PYTHONUNBUFFERED: '1'
        run: python scripts/build_step10_v2.py --verify-reproducibility
      - name: Upload certified STEP10 V2 artifact
        if: steps.restore.outcome == 'success' && steps.step10v2.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: step10-v2-exit-analysis
          path: |
            momentum5d/data/market_history/analysis/step10_exit_analysis_v2/
            momentum5d/data/market_history/quality/step10_v2_report.json
            momentum5d/data/market_history/quality/STEP10_V2_REPORT.md
            momentum5d/data/market_history/quality/STEP11_V2_PROMPT.md
            momentum5d/data/market_history/quality/step10_input_provenance.json
          if-no-files-found: error
          retention-days: 90
      - name: Upload failed STEP10 V2 diagnostics
        if: always() && (steps.restore.outcome != 'success' || steps.step10v2.outcome != 'success')
        uses: actions/upload-artifact@v4
        with:
          name: step10-v2-exit-analysis-failed
          path: |
            momentum5d/data/market_history/analysis/step10_exit_analysis_v2/
            momentum5d/data/market_history/quality/step10_v2_report.json
            momentum5d/data/market_history/quality/STEP10_V2_REPORT.md
            momentum5d/data/market_history/quality/STEP11_V2_PROMPT.md
            momentum5d/data/market_history/quality/step10_input_provenance.json
          if-no-files-found: warn
          retention-days: 30
      - name: Enforce STEP10 V2 PASS
        if: always() && (steps.restore.outcome != 'success' || steps.step10v2.outcome != 'success')
        run: exit 1
