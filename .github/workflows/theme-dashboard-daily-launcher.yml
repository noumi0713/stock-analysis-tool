name: Theme ABC dashboard daily launcher

on:
  workflow_dispatch:
  schedule:
    # 16:20 / 17:20 / 18:20 JST, Monday-Friday.
    # The later two runs act as automatic retries when Yahoo daily data is late.
    - cron: '20 7 * * 1-5'
    - cron: '20 8 * * 1-5'
    - cron: '20 9 * * 1-5'

permissions:
  contents: write

concurrency:
  group: theme-abc-dashboard-daily
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/theme-abc-dashboard-auto
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check pandas numpy yfinance exchange_calendars

      - name: Build candidate snapshot
        id: snapshot
        shell: bash
        run: |
          set +e
          python research/theme_dashboard_snapshot.py
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Verify latest completed TSE session
        id: freshness
        if: steps.snapshot.outputs.exit_code == '0'
        shell: bash
        run: |
          set +e
          python research/validate_theme_dashboard_freshness.py
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Restore previous certified snapshot when stale
        if: steps.snapshot.outputs.exit_code == '0' && steps.freshness.outputs.exit_code != '0'
        shell: bash
        run: |
          for f in \
            theme-dashboard/data/chatgpt_snapshot.json \
            theme-dashboard/data/top10.json \
            theme-dashboard/data/a.json \
            theme-dashboard/data/b.json \
            theme-dashboard/data/c.json \
            theme-dashboard/data/standalone.json; do
            if git ls-files --error-unmatch "$f" >/dev/null 2>&1; then
              git restore "$f"
            else
              rm -f "$f"
            fi
          done

      - name: Commit dashboard data to feature branch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add theme-dashboard/data
          if git diff --cached --quiet; then
            echo "No dashboard data changes"
          else
            git commit -m "Update theme dashboard data status"
            git pull --rebase origin feature/theme-abc-dashboard-auto
            git push origin HEAD:feature/theme-abc-dashboard-auto
          fi

      - name: Fail workflow when quality or freshness gate failed
        if: steps.snapshot.outputs.exit_code != '0' || (steps.freshness.outcome == 'success' && steps.freshness.outputs.exit_code != '0')
        run: |
          echo "Theme dashboard was not certified for the latest completed TSE session; previous certified snapshot was preserved."
          exit 1
