name: Momentum 5D daily analysis

on:
  workflow_dispatch:
    inputs:
      session:
        description: 更新する取引セッション
        required: true
        default: morning
        type: choice
        options:
          - morning
          - close
  push:
    branches:
      - main
    paths:
      - ".github/workflows/momentum5d-daily.yml"
      - "momentum5d/**"
  schedule:
    # GitHubの遅延・取りこぼしに備え、完了するまで20分間隔で再試行する。
    # 同一セッションが完了済みなら後続の実行は直ちに終了する。
    - cron: "50 2 * * 1-5"
    - cron: "10 3 * * 1-5"
    - cron: "30 3 * * 1-5"
    - cron: "50 6 * * 1-5"
    - cron: "10 7 * * 1-5"
    - cron: "30 7 * * 1-5"

concurrency:
  group: momentum5d-daily
  # コード更新は古い実装の実行を置き換える。定時更新同士は順番を守る。
  cancel-in-progress: ${{ github.event_name == 'push' }}

permissions:
  contents: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: momentum5d
    env:
      YAHOO_RETENTION_DAYS: "365"
      YAHOO_OVERLAP_DAYS: "10"
      YAHOO_BATCH_SIZE: "60"
      YAHOO_PAUSE_SECONDS: "1.5"
      YAHOO_MAX_RETRIES: "3"
      YAHOO_TIMEOUT_SECONDS: "30"
      YAHOO_INTRADAY_MIN_COVERAGE: "0.70"

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Select session and skip completed retries
        id: update
        shell: bash
        env:
          REQUESTED_SESSION: ${{ inputs.session }}
          SCHEDULE_EXPRESSION: ${{ github.event.schedule }}
        run: |
          set -euo pipefail
          session="${REQUESTED_SESSION:-}"
          case "${SCHEDULE_EXPRESSION:-}" in
            "50 2 * * 1-5"|"10 3 * * 1-5"|"30 3 * * 1-5")
              session="morning"
              ;;
            "50 6 * * 1-5"|"10 7 * * 1-5"|"30 7 * * 1-5")
              session="close"
              ;;
          esac
          market_date=""
          if [ -z "$session" ]; then
            jst_hhmm="$(TZ=Asia/Tokyo date +%H%M)"
            jst_weekday="$(TZ=Asia/Tokyo date +%u)"
            if [ "$jst_weekday" -ge 6 ] || [ "$jst_hhmm" -lt 1140 ]; then
              # 市場開始前のコード更新では、存在しない当日5分足を要求せず、
              # 休日を含め公開済みの直近営業日を新しい分析ロジックで再生成する。
              session="close"
              market_date="$(python3 - <<'PY'
          import json
          from pathlib import Path

          payload = json.loads(Path("../dashboard-data/latest.json").read_text())
          update = payload.get("update") or {}
          print(update.get("market_date") or payload["latest_date"])
          PY
              )"
            elif [ "$jst_hhmm" -lt 1540 ]; then
              session="morning"
            else
              session="close"
            fi
          fi
          scheduling_args=(
            app/yahoo/scheduling.py
            --session "$session"
            --dashboard ../dashboard-data/latest.json
            --github-output "$GITHUB_OUTPUT"
          )
          if [ -n "$market_date" ]; then
            scheduling_args+=(--market-date "$market_date")
          fi
          if [ "${GITHUB_EVENT_NAME:-}" = "push" ]; then
            # 対象銘柄や分析ロジックの変更は完了済みセッションでも再生成する。
            scheduling_args+=(--force)
          fi
          python3 "${scheduling_args[@]}"

      - name: Set up Python 3.12
        if: steps.update.outputs.should_run == 'true'
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: momentum5d/pyproject.toml

      - name: Install application
        if: steps.update.outputs.should_run == 'true'
        run: python -m pip install ".[dev]"

      - name: Run unit tests
        if: steps.update.outputs.should_run == 'true'
        run: |
          python -m pytest -q
          python -m ruff check app tests

      - name: Refresh TSE stock universe from JPX
        if: steps.update.outputs.should_run == 'true'
        run: python app/yahoo/universe.py --config-dir config

      - name: Download daily and five-minute session data
        if: steps.update.outputs.should_run == 'true'
        run: >-
          python -m app yahoo-ingest
          --as-of "${{ steps.update.outputs.market_date }}"
          --tickers-file config/prime_tickers.txt
          --intraday-session "${{ steps.update.outputs.session }}"

      - name: Validate downloaded data
        if: steps.update.outputs.should_run == 'true'
        run: python -m app yahoo-validate

      - name: Analyze +5% price and volume patterns
        if: steps.update.outputs.should_run == 'true'
        run: python -m app yahoo-analyze --top-n 20

      - name: Export dashboard payload
        if: steps.update.outputs.should_run == 'true'
        run: python -m app yahoo-export-dashboard --output work/latest.json

      - name: Publish aggregate result for the mobile dashboard
        if: steps.update.outputs.should_run == 'true'
        run: |
          mkdir -p ../dashboard-data
          cp work/latest.json ../dashboard-data/latest.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ../dashboard-data/latest.json
          if git diff --cached --quiet; then
            echo "Dashboard payload is unchanged."
            exit 0
          fi
          git commit -m "Update Momentum 5D dashboard data"
          git push
