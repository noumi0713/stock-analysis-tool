name: Momentum10D close signals

on:
  workflow_dispatch:
    inputs:
      force:
        description: 公開済みの営業日も再生成する
        required: false
        default: false
        type: boolean
  push:
    # Rebuild the lightweight JSON immediately when the live signal rule changes.
    branches:
      - main
    paths:
      - .github/workflows/momentum5d-daily.yml
      - momentum5d/app/live_strategy.py
      - momentum5d/app/evaluation_protocol.py
      - momentum5d/app/forward_validation.py
      - momentum5d/app/secondary_decision_log.py
      - momentum5d/app/resources/strategy_specs/live_v1_2026-08-31.json
      - momentum5d/app/resources/evaluation_protocols/*.json
      - momentum5d/scripts/export_close_signals.py
      - momentum5d/scripts/resolve_close_ingest.py
      - dashboard-data/theme_members.csv
  schedule:
    # 東証大引け後。最初の成功後は同一営業日の再試行をスキップする。
    - cron: "50 6 * * 1-5"
    - cron: "10 7 * * 1-5"
    - cron: "30 7 * * 1-5"

concurrency:
  group: momentum10d-close-signals
  cancel-in-progress: false

permissions:
  contents: write

env:
  # MA75の10営業日傾きを計算するには最低85営業日が必要。
  YAHOO_RETENTION_DAYS: "180"
  YAHOO_OVERLAP_DAYS: "10"
  YAHOO_BATCH_SIZE: "60"
  YAHOO_PAUSE_SECONDS: "1.5"
  YAHOO_MAX_RETRIES: "3"
  YAHOO_TIMEOUT_SECONDS: "30"
  YAHOO_INTRADAY_MIN_COVERAGE: "0.70"

jobs:
  publish_close_signals:
    name: Publish next-session signals after close
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: momentum5d

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Restore rolling Yahoo prices
        uses: actions/cache/restore@v4
        with:
          path: momentum5d/data/yahoo
          key: momentum10d-close-${{ github.run_id }}
          restore-keys: |
            momentum10d-close-
            momentum5d-data-ready-
            momentum5d-backtest-ready-
            momentum5d-final-
            momentum5d-yahoo-

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: momentum5d/pyproject.toml

      - name: Install signal detector
        run: python -m pip install ".[dev]"

      - name: Run signal-detector tests
        run: |
          python -m scripts.verify_live_strategy
          # Run as a file path as production does. This imports the installed wheel,
          # so missing packaged strategy resources fail before market data is touched.
          python scripts/export_close_signals.py --help >/dev/null
          python -m pytest -q \
            tests/test_live_strategy.py \
            tests/test_evaluation_protocol.py \
            tests/test_forward_validation.py \
            tests/test_secondary_decision_log.py \
            tests/test_adjustments.py \
            tests/test_point_in_time_universe.py \
            tests/test_live_backtest.py \
            tests/test_live_backtest_input_audit.py \
            tests/test_close_signals_export.py \
            tests/test_close_ingest_plan.py
          python -m ruff check \
            app/live_strategy.py \
            app/evaluation_protocol.py \
            app/forward_validation.py \
            app/secondary_decision_log.py \
            app/adjustments.py \
            app/point_in_time_universe.py \
            app/live_backtest.py \
            scripts/verify_live_strategy.py \
            scripts/run_live_strategy_backtest.py \
            scripts/record_secondary_decisions.py \
            scripts/evaluate_secondary_decisions.py \
            scripts/check_oos_status.py \
            scripts/check_forward_readiness.py \
            scripts/export_close_signals.py \
            scripts/resolve_close_ingest.py \
            tests/test_live_strategy.py \
            tests/test_close_signals_export.py \
            tests/test_close_ingest_plan.py

      - name: Refresh TSE universe
        run: >-
          python app/yahoo/universe.py
          --config-dir config
          --history-start "$(date -u -d '3 years ago' +%F)"
          --as-of "$(date -u +%F)"

      - name: Resolve completed market session
        id: close_plan
        if: github.event_name != 'push' || contains(github.event.head_commit.message, '[refresh-yahoo]')
        run: python scripts/resolve_close_ingest.py >> "$GITHUB_OUTPUT"

      - name: Download close data only
        # 遅延実行は前日の日足へ切り替え、5分足障害時も日足で更新を継続する。
        if: github.event_name != 'push' || contains(github.event.head_commit.message, '[refresh-yahoo]')
        env:
          CLOSE_AS_OF: ${{ steps.close_plan.outputs.as_of }}
          USE_INTRADAY_CLOSE: ${{ steps.close_plan.outputs.use_intraday_close }}
        run: |
          set -euo pipefail
          if [[ "$USE_INTRADAY_CLOSE" == "true" ]]; then
            if python -m app yahoo-ingest \
              --as-of "$CLOSE_AS_OF" \
              --tickers-file config/prime_tickers.txt \
              --intraday-session close; then
              exit 0
            fi
            echo "::warning::5分足の取得に失敗したため日足へ切り替えます。"
          fi
          python -m app yahoo-ingest \
            --as-of "$CLOSE_AS_OF" \
            --tickers-file config/prime_tickers.txt

      - name: Skip an already published market date
        id: update
        env:
          REQUESTED_FORCE: ${{ inputs.force }}
          WORKFLOW_EVENT: ${{ github.event_name }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          import pandas as pd

          prices = pd.read_parquet(
              "data/yahoo/processed/equities_daily.parquet",
              columns=["date"],
          )
          latest_date = str(pd.to_datetime(prices["date"]).max().date())
          published_path = Path("../dashboard-data/latest_signals.json")
          published_date = ""
          published_is_close = False
          if published_path.exists():
              published = json.loads(published_path.read_text(encoding="utf-8"))
              published_date = str(published.get("date") or "")
              published_is_close = (
                  int(published.get("schema_version") or 0) >= 2
                  and (published.get("update") or {}).get("session") == "close"
              )
          force = (
              os.environ.get("REQUESTED_FORCE", "false").lower() == "true"
              or os.environ.get("WORKFLOW_EVENT") == "push"
          )
          should_run = force or published_date != latest_date or not published_is_close
          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as output:
              output.write(f"should_run={str(should_run).lower()}\n")
              output.write(f"market_date={latest_date}\n")
          print(
              f"latest={latest_date} published={published_date or '-'} "
              f"close={published_is_close} should_run={should_run}"
          )
          PY

      - name: Validate close data
        if: steps.update.outputs.should_run == 'true'
        run: python -m app yahoo-validate

      - name: Build next-session signal JSON
        if: steps.update.outputs.should_run == 'true'
        run: >-
          python scripts/export_close_signals.py
          --prices data/yahoo/processed/equities_daily.parquet
          --names config/prime_names.csv
          --themes ../dashboard-data/theme_members.csv
          --output work/latest_signals.json

      - name: Save rolling price cache
        uses: actions/cache/save@v4
        with:
          path: momentum5d/data/yahoo
          key: momentum10d-close-${{ github.run_id }}

      - name: Publish lightweight signals
        if: steps.update.outputs.should_run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          target_branch="${GITHUB_REF_NAME}"
          tmp_signals="$(mktemp)"
          cp work/latest_signals.json "$tmp_signals"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for attempt in 1 2 3 4 5; do
            git rebase --abort >/dev/null 2>&1 || true
            git fetch origin "$target_branch"
            git reset --hard "origin/${target_branch}"
            cp "$tmp_signals" ../dashboard-data/latest_signals.json
            git add -- ../dashboard-data/latest_signals.json

            if git diff --cached --quiet; then
              echo "Signals are already current."
              exit 0
            fi

            git commit -m "Update Momentum10D close signals"
            if git pull --rebase origin "$target_branch" && git push origin "HEAD:${target_branch}"; then
              echo "Close signals published successfully."
              exit 0
            fi
            git rebase --abort >/dev/null 2>&1 || true
            sleep $((attempt * 2))
          done

          echo "Failed to publish close signals after 5 attempts." >&2
          exit 1
