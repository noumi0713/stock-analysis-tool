name: Momentum 5D daily analysis

on:
  workflow_dispatch:
  schedule:
    # GitHub Actions cron is UTC. 09:10 UTC = 18:10 JST.
    - cron: "10 9 * * 1-5"

concurrency:
  group: momentum5d-daily
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: momentum5d
    env:
      YAHOO_RETENTION_DAYS: "365"
      YAHOO_OVERLAP_DAYS: "10"
      YAHOO_BATCH_SIZE: "40"
      YAHOO_PAUSE_SECONDS: "2"
      YAHOO_MAX_RETRIES: "3"
      YAHOO_TIMEOUT_SECONDS: "30"

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: momentum5d/pyproject.toml

      - name: Install application
        run: python -m pip install ".[dev]"

      - name: Run unit tests
        run: |
          python -m pytest -q
          python -m ruff check app tests

      - name: Download the latest rolling year
        run: >-
          python -m app yahoo-ingest
          --tickers-file config/prime_tickers.txt
          --full-refresh

      - name: Validate downloaded data
        run: python -m app yahoo-validate

      - name: Analyze +5% price and volume patterns
        run: python -m app yahoo-analyze --top-n 20

      - name: Export private dashboard payload
        run: python -m app yahoo-export-dashboard --output work/latest.json

      - name: Send the result to the private dashboard
        env:
          DASHBOARD_UPDATE_TOKEN: ${{ secrets.DASHBOARD_UPDATE_TOKEN }}
        run: |
          test -n "$DASHBOARD_UPDATE_TOKEN"
          curl --fail-with-body --silent --show-error \
            --retry 3 --retry-all-errors \
            -X POST "https://momentum-5d-prime.no31work.chatgpt.site/api/dashboard" \
            -H "X-Dashboard-Token: $DASHBOARD_UPDATE_TOKEN" \
            -H "Content-Type: application/json" \
            --data-binary @work/latest.json
