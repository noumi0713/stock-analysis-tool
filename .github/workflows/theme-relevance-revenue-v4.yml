name: Theme relevance revenue v4

on:
  workflow_dispatch:
  push:
    branches:
      - research/first-pullback-watch-prototype
    paths:
      - "research/collect_revenue_mix_v4.py"
      - "research/score_theme_relevance_v4.py"
      - ".github/workflows/theme-relevance-revenue-v4.yml"

concurrency:
  group: theme-relevance-revenue-v4
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  revenue-v4:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install --disable-pip-version-check -q requests beautifulsoup4 pypdf
      - name: Collect company-IR revenue mix
        run: python research/collect_revenue_mix_v4.py --batch 1 --workers 10
      - name: Score relevance with revenue share
        run: python research/score_theme_relevance_v4.py --batch 1
      - name: Commit v4 outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/results/theme_relevance_batches/batch_001_revenue_mix_v4.csv \
                  research/results/theme_relevance_batches/batch_001_revenue_mix_v4_summary.json \
                  research/results/theme_relevance_batches/batch_001_scores_v4.csv \
                  research/results/theme_relevance_batches/batch_001_score_summary_v4.json
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Rebuild batch 001 relevance with revenue share v4"
            git pull --rebase origin research/first-pullback-watch-prototype
            git push
          fi
