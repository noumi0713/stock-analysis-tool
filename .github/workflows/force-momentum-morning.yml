name: Force Momentum morning dispatch

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/force-momentum-morning.yml"

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch Momentum morning workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail-with-body \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/${{ github.repository }}/actions/workflows/momentum5d-daily.yml/dispatches \
            -d '{"ref":"main","inputs":{"session":"morning","force":"true"}}'

