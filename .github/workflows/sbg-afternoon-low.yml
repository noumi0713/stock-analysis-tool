name: SBG afternoon low time test

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/sbg-afternoon-low.yml'

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install yfinance==1.7.0 pandas>=2.2
      - name: Analyze completed afternoons
        run: |
          python - <<'PY'
          import pandas as pd
          import yfinance as yf

          t = "9984.T"
          df = yf.Ticker(t).history(period="max", interval="1m", auto_adjust=False, prepost=False, actions=False)
          if df is None or df.empty:
              raise SystemExit("no data")

          idx = pd.DatetimeIndex(df.index)
          idx = idx.tz_localize("Asia/Tokyo") if idx.tz is None else idx.tz_convert("Asia/Tokyo")
          df = df.copy()
          df.index = idx

          aft = df.between_time("12:30", "15:30", inclusive="both").copy()
          today = pd.Timestamp.now(tz="Asia/Tokyo").strftime("%Y-%m-%d")
          dates = [d for d in sorted(pd.Index(aft.index.strftime("%Y-%m-%d")).unique()) if d < today][-5:]

          mins = []
          print("Date,AfternoonLow,LowTime,AfternoonHigh,HighTime")
          for d in dates:
              g = aft[aft.index.strftime("%Y-%m-%d") == d]
              lows = pd.to_numeric(g["Low"], errors="coerce")
              highs = pd.to_numeric(g["High"], errors="coerce")
              lp = float(lows.min())
              hp = float(highs.max())
              lts = g.index[lows == lp][0]
              hts = g.index[highs == hp][0]
              mins.append(lts.hour * 60 + lts.minute)
              print(f"{d},{lp},{lts.strftime('%H:%M')},{hp},{hts.strftime('%H:%M')}")

          med = int(pd.Series(mins).median())
          mean = int(round(pd.Series(mins).mean()))
          print(f"MedianLowTime={med//60:02d}:{med%60:02d}")
          print(f"MeanLowTime={mean//60:02d}:{mean%60:02d}")
          PY
