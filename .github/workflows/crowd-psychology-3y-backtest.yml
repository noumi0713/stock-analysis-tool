name: Crowd psychology 3y backtest

on:
  push:
    branches:
      - research/crowd-psychology-3y-backtest
    paths:
      - "momentum5d/scripts/backtest_crowd_psychology.py"
      - "momentum5d/scripts/backtest_crowd_psychology_v2.py"
      - "momentum5d/scripts/test_psychology_participation.py"
      - ".github/workflows/crowd-psychology-3y-backtest.yml"
      - "dashboard-data/technical-backtest-3y/**"
  workflow_dispatch:

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install research dependencies
        run: python -m pip install --disable-pip-version-check pandas numpy

      - name: Run 3-year all-TSE holdout backtest
        run: |
          mkdir -p research-output
          python momentum5d/scripts/backtest_crowd_psychology_v2.py \
            --data-dir dashboard-data/technical-backtest-3y \
            --output-json research-output/crowd-psychology-backtest-v2.json \
            --output-md research-output/crowd-psychology-backtest-v2.md

      - name: Run participation sensitivity test
        run: |
          python momentum5d/scripts/test_psychology_participation.py \
            --data-dir dashboard-data/technical-backtest-3y \
            --output-json research-output/psychology-participation-test.json \
            --output-md research-output/psychology-participation-test.md

      - name: Show summary
        if: always()
        run: |
          if [ -f research-output/crowd-psychology-backtest-v2.md ]; then
            cat research-output/crowd-psychology-backtest-v2.md
          fi
          if [ -f research-output/psychology-participation-test.md ]; then
            cat research-output/psychology-participation-test.md
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: crowd-psychology-3y-backtest-v3
          path: research-output/
          if-no-files-found: warn
