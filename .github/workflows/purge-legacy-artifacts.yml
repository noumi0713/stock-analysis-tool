name: purge-legacy-artifacts

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/purge-legacy-artifacts.yml'

permissions:
  actions: write
  contents: read

concurrency:
  group: purge-legacy-artifacts
  cancel-in-progress: false

jobs:
  purge:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Keep newest certified raw dataset and delete legacy artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          gh api --paginate "repos/${GITHUB_REPOSITORY}/actions/artifacts?per_page=100" \
            --jq '.artifacts[] | [.id,.name,.created_at,.expired] | @tsv' > /tmp/artifacts.tsv

          total=$(wc -l < /tmp/artifacts.tsv | tr -d ' ')
          keep_id=$(awk -F '\t' '$2=="market-history-certified" && $4=="false" {print $1"\t"$3}' /tmp/artifacts.tsv \
            | sort -t $'\t' -k2,2r | head -n1 | cut -f1)

          if [ -z "${keep_id:-}" ]; then
            echo "No unexpired market-history-certified artifact exists; aborting purge."
            exit 1
          fi

          echo "Total artifacts before purge: $total"
          echo "Keeping latest market-history-certified artifact id: $keep_id"

          deleted=0
          failed=0
          while IFS=$'\t' read -r id name created expired; do
            if [ "$id" = "$keep_id" ]; then
              echo "KEEP $id $name $created"
              continue
            fi
            if gh api --method DELETE "repos/${GITHUB_REPOSITORY}/actions/artifacts/$id" >/dev/null; then
              deleted=$((deleted+1))
            else
              echo "DELETE FAILED $id $name"
              failed=$((failed+1))
            fi
          done < /tmp/artifacts.tsv

          echo "deleted=$deleted failed=$failed"
          if [ "$failed" -ne 0 ]; then
            exit 1
          fi

          remaining=$(gh api --paginate "repos/${GITHUB_REPOSITORY}/actions/artifacts?per_page=100" --jq '.artifacts | length' \
            | awk '{s+=$1} END {print s+0}')
          echo "Remaining artifacts: $remaining"
          test "$remaining" -eq 1

          remaining_id=$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts?per_page=100" --jq '.artifacts[0].id')
          remaining_name=$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts?per_page=100" --jq '.artifacts[0].name')
          test "$remaining_id" = "$keep_id"
          test "$remaining_name" = "market-history-certified"
