name: Theme relevance revenue v6

on:
  workflow_dispatch:
  push:
    branches:
      - research/first-pullback-watch-prototype
    paths:
      - "research/collect_revenue_mix_v6.py"
      - "research/score_theme_relevance_v6.py"
      - "research/test_revenue_mix_v6.py"
      - ".github/workflows/theme-relevance-revenue-v6.yml"

permissions:
  contents: write

concurrency:
  group: theme-relevance-revenue-v6
  cancel-in-progress: true

jobs:
  revenue-v6:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install --disable-pip-version-check -q requests beautifulsoup4 pypdf
      - name: Collect coherent official revenue mix
        run: python research/collect_revenue_mix_v6.py --batch 1 --workers 10
      - name: Run v6 revenue QA
        run: python research/test_revenue_mix_v6.py
      - name: Score relevance v6
        run: python research/score_theme_relevance_v6.py --batch 1
      - name: Commit v6 outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/results/theme_relevance_batches/batch_001_revenue_mix_v6.csv \
                  research/results/theme_relevance_batches/batch_001_segments_v6.csv \
                  research/results/theme_relevance_batches/batch_001_revenue_mix_v6_summary.json \
                  research/results/theme_relevance_batches/batch_001_scores_v6.csv \
                  research/results/theme_relevance_batches/batch_001_score_summary_v6.json
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Rebuild batch 001 relevance with coherent revenue tables v6"
            git pull --rebase origin research/first-pullback-watch-prototype
            git push
          fi
