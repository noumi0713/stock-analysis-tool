name: Demand acceleration 3Y research

on:
  workflow_dispatch:
  push:
    branches:
      - research/quality-demand-acceleration-3y
    paths:
      - "research/demand_acceleration_3y.py"
      - "research/run_demand_acceleration_3y.py"
      - ".github/workflows/demand-acceleration-3y.yml"

permissions:
  contents: write

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out research branch
        uses: actions/checkout@v6

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Run three-year demand acceleration study
        run: python research/run_demand_acceleration_3y.py

      - name: Publish research result
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/results/demand_acceleration_3y/
          if git diff --cached --quiet; then
            echo "Research result unchanged."
            exit 0
          fi
          git commit -m "Add 3y demand acceleration results"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
