name: Check frozen intraday forecast

on:
  workflow_dispatch:
  schedule:
    - cron: '25 23 * * 0-4' # 08:25 JST, Monday-Friday

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: swing_data/requirements.txt
      - run: pip install -r swing_data/requirements.txt
      - name: Check archive and publish a missing-record alert if needed
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          trade_date=$(TZ=Asia/Tokyo date +%F)
          relative="${trade_date:0:4}/${trade_date:5:2}/${trade_date}.json"
          pick_args=()
          if git fetch origin refs/heads/morning-0815-snapshots:refs/remotes/origin/morning-0815-snapshots; then
            if git show "origin/morning-0815-snapshots:picks/$relative" > "$RUNNER_TEMP/picks.json"; then
              pick_args=(--picks "$RUNNER_TEMP/picks.json")
            fi
          fi
          python -m swing_data.intraday_notice --trade-date "$trade_date" "${pick_args[@]}"
