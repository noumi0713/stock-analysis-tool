name: market-history-data

on:
  workflow_dispatch:
    inputs:
      mode:
        description: bootstrap or update
        required: true
        default: bootstrap
        type: choice
        options: [bootstrap, update]
  push:
    branches: [main]
    paths:
      - '.github/workflows/market-history-data.yml'
      - 'momentum5d/scripts/build_market_history.py'
      - 'momentum5d/config/market_history_tickers.json'
  schedule:
    - cron: '30 9 * * 1-5'

permissions:
  contents: read
  actions: read

concurrency:
  group: market-history-data
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    defaults:
      run:
        working-directory: momentum5d
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: momentum5d/pyproject.toml

      - name: Install dependencies
        run: pip install -e .

      - name: Restore prior certified dataset for incremental update
        if: github.event_name == 'schedule' || inputs.mode == 'update'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p data/market_history
          run_id=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow market-history-data.yml --status success -L 1 --json databaseId --jq '.[0].databaseId // empty')
          if [ -n "$run_id" ]; then
            gh run download "$run_id" --repo "$GITHUB_REPOSITORY" -n market-history-certified -D data/market_history || true
          fi

      - name: Build and quality-check history
        id: build
        continue-on-error: true
        env:
          PYTHONUNBUFFERED: '1'
        run: |
          mkdir -p data
          mode='${{ inputs.mode }}'
          if [ "$GITHUB_EVENT_NAME" = push ]; then mode=bootstrap; fi
          if [ -z "$mode" ]; then mode=update; fi
          if [ "$mode" = update ] && [ ! -d data/market_history/raw/equities ]; then mode=bootstrap; fi
          python scripts/build_market_history.py --mode "$mode" --batch-size 150

      - name: Upload certified dataset
        if: steps.build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: market-history-certified
          path: momentum5d/data/market_history/
          retention-days: 90
          compression-level: 6
          if-no-files-found: error

      - name: Upload failed staging and quality evidence
        if: steps.build.outcome != 'success'
        uses: actions/upload-artifact@v4
        with:
          name: market-history-failed-${{ github.run_id }}
          path: momentum5d/data/market_history/
          retention-days: 30
          compression-level: 6
          if-no-files-found: warn

      - name: Enforce quality gate
        if: steps.build.outcome != 'success'
        run: exit 1
