name: SBG 1500 to 1530 return

on:
  push:
    branches:
      - analysis/sbg-1500-1530-20260918
    paths:
      - '.github/workflows/sbg-1500-1530.yml'

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install yfinance==1.7.0 pandas>=2.2
      - name: Analyze
        run: |
          python - <<'PY'
          import pandas as pd
          import yfinance as yf

          df = yf.Ticker("9984.T").history(period="max", interval="1m", auto_adjust=False, prepost=False, actions=False)
          idx = pd.DatetimeIndex(df.index)
          idx = idx.tz_localize("Asia/Tokyo") if idx.tz is None else idx.tz_convert("Asia/Tokyo")
          df = df.copy()
          df.index = idx

          for d in ["2026-09-16","2026-09-17"]:
              g = df[df.index.strftime("%Y-%m-%d") == d]
              b = g[g.index.strftime("%H:%M") == "15:00"]
              c = g[g.index.strftime("%H:%M") == "15:30"]
              if b.empty or c.empty:
                  print(d, "missing")
                  continue
              buy_open = float(b.iloc[0]["Open"])
              buy_close = float(b.iloc[0]["Close"])
              close1530 = float(c.iloc[0]["Close"])
              ret_open = (close1530 / buy_open - 1) * 100
              ret_close = (close1530 / buy_close - 1) * 100
              print(f"{d},Open1500={buy_open},Close1500={buy_close},Close1530={close1530},ReturnFromOpen1500Pct={ret_open:.4f},ReturnFromClose1500Pct={ret_close:.4f}")
          PY
