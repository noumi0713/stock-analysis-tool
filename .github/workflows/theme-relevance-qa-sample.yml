name: Theme relevance QA sample

on:
  workflow_dispatch:
  push:
    branches:
      - research/first-pullback-watch-prototype
    paths:
      - "research/sample_theme_relevance_qa.py"
      - ".github/workflows/theme-relevance-qa-sample.yml"

permissions:
  contents: write

jobs:
  sample:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python research/sample_theme_relevance_qa.py --batch 1 --per-group 5
      - name: Commit QA sample
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/results/theme_relevance_batches/batch_001_qa_sample.csv
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Add theme relevance batch 001 QA sample"
            git pull --rebase origin research/first-pullback-watch-prototype
            git push
          fi
