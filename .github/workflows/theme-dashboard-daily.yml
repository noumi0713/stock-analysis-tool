name: Theme ABC dashboard daily

on:
  workflow_dispatch:
  push:
    branches:
      - feature/theme-abc-dashboard-auto
    paths:
      - 'research/theme_dashboard_snapshot.py'
      - 'theme-dashboard/index.html'
      - 'theme-dashboard/chatgpt.txt'
      - '.github/workflows/theme-dashboard-daily.yml'
  schedule:
    # 16:20 JST, Monday-Friday. Japan has no DST.
    - cron: '20 7 * * 1-5'

permissions:
  contents: write

concurrency:
  group: theme-abc-dashboard-daily
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/theme-abc-dashboard-auto
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check pandas numpy yfinance

      - name: Build certified snapshot
        id: snapshot
        shell: bash
        run: |
          set +e
          python research/theme_dashboard_snapshot.py
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Commit dashboard data
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add theme-dashboard/data
          if git diff --cached --quiet; then
            echo "No dashboard data changes"
          else
            git commit -m "Update certified theme dashboard snapshot"
            git pull --rebase origin feature/theme-abc-dashboard-auto
            git push origin HEAD:feature/theme-abc-dashboard-auto
          fi

      - name: Fail workflow when quality gate failed
        if: steps.snapshot.outputs.exit_code != '0'
        run: |
          echo "Theme dashboard quality gate failed; previous certified snapshot was preserved."
          exit 1
