name: IFIS top10 theme membership check

on:
  workflow_dispatch:
  push:
    branches:
      - research/first-pullback-watch-prototype
    paths:
      - ".github/workflows/ifis-top10-theme-membership-check.yml"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Fetch theme research branch
        run: git fetch origin research/volume-top100-overheat:refs/remotes/origin/research/volume-top100-overheat
      - name: Extract memberships
        shell: python
        run: |
          import csv, io, subprocess, re
          wanted = {"1848","5273","6993","7523","5817","6543","9082","7066","4809","3094"}
          raw = subprocess.check_output(["git","show","origin/research/volume-top100-overheat:research/data/theme_members_124.csv"], text=True)
          print("RAW_HEAD")
          for line in raw.splitlines()[:5]: print(repr(line))
          reader = csv.DictReader(io.StringIO(raw))
          print("FIELDNAMES", reader.fieldnames)
          parsed = list(reader)
          def norm(v):
              m = re.search(r"(\d{4})", str(v or ""))
              return m.group(1) if m else ""
          code_keys = [k for k in (reader.fieldnames or []) if any(x in k.lower() for x in ['code','ticker','symbol','銘柄'])]
          print("CODE_KEYS", code_keys)
          rows=[]
          for r in parsed:
              vals=' '.join(str(v) for v in r.values())
              m=re.search(r'(?<!\d)(\d{4})(?:\.T)?(?!\d)', vals)
              code=m.group(1) if m else ''
              if code in wanted: rows.append((code,r))
          print("MATCHES", len(rows))
          for code,r in sorted(rows,key=lambda x:x[0]): print("MATCH",code,r)
          print("MISSING", ','.join(sorted(wanted-{c for c,_ in rows})))
