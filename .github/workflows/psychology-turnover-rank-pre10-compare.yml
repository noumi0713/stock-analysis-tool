name: Psychology turnover rank pre10 compare

on:
  push:
    branches:
      - research/crowd-psychology-3y-backtest
    paths:
      - 'momentum5d/scripts/compare_psychology_turnover_rank_pre10.py'
      - '.github/workflows/psychology-turnover-rank-pre10-compare.yml'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check pandas numpy
      - name: Run comparison
        run: |
          mkdir -p research-output
          python momentum5d/scripts/compare_psychology_turnover_rank_pre10.py \
            --data-dir dashboard-data/technical-backtest-3y \
            --output-json research-output/psychology-turnover-rank-pre10-compare.json \
            --output-md research-output/psychology-turnover-rank-pre10-compare.md
      - name: Show summary
        run: cat research-output/psychology-turnover-rank-pre10-compare.md
      - uses: actions/upload-artifact@v4
        with:
          name: psychology-turnover-rank-pre10-compare
          path: research-output/
