name: Pullback cache diagnostics August 2026
# Re-run after the production 180-day Yahoo cache backfill.

on:
  push:
    branches:
      - codex/pullback-retro-20260824-25
    paths:
      - .github/workflows/pullback-retro-test.yml

permissions:
  contents: read

jobs:
  retro_test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: momentum5d
    steps:
      - uses: actions/checkout@v6

      - name: Restore production Yahoo price cache
        uses: actions/cache/restore@v4
        with:
          path: momentum5d/data/yahoo
          key: pullback-retro-${{ github.run_id }}
          restore-keys: |
            momentum10d-close-
            momentum5d-data-ready-
            momentum5d-backtest-ready-
            momentum5d-final-

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: momentum5d/pyproject.toml

      - name: Install detector
        run: python -m pip install .

      - name: Re-test pullback signals
        run: >-
          python scripts/export_pullback_retro_test.py
          --prices data/yahoo/processed/equities_daily.parquet
          --names config/prime_names.csv
          --dates
          2026-08-03 2026-08-04 2026-08-05 2026-08-06 2026-08-07
          2026-08-10 2026-08-12 2026-08-13 2026-08-14 2026-08-17
          2026-08-18 2026-08-19 2026-08-20 2026-08-21 2026-08-24
          2026-08-25 2026-08-26
          --output work/pullback_retro_august.json

      - name: Upload result
        uses: actions/upload-artifact@v4
        with:
          name: pullback-retro-august-diagnostics
          path: momentum5d/work/pullback_retro_august.json
          if-no-files-found: error
