name: Theme weekly rotation 124 3Y

on:
  workflow_dispatch:
  push:
    branches:
      - research/theme-taxonomy-124-v1
    paths:
      - research/theme_weekly_rotation_124_3y.py
      - .github/workflows/theme-weekly-rotation-124-3y.yml

concurrency:
  group: theme-weekly-rotation-124-3y-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  research:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out research branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Run 124-theme three-year study
        run: python research/theme_weekly_rotation_124_3y.py

      - name: Publish research results
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/results/theme_weekly_rotation_124_3y/summary.json \
                  research/results/theme_weekly_rotation_124_3y/weekly_rankings.csv \
                  research/results/theme_weekly_rotation_124_3y/performance_summary.csv
          if git diff --cached --quiet; then
            echo "Research result unchanged."
            exit 0
          fi
          git commit -m "Publish 124-theme 3y weekly rotation results"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
