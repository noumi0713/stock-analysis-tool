name: Material breakout pullback 3Y research

on:
  workflow_dispatch:
  push:
    branches:
      - agent/demand-supply-study
    paths:
      - "research/material_breakout_pullback_3y.py"
      - ".github/workflows/material-breakout-pullback-3y.yml"

permissions:
  contents: write

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Restore rolling Yahoo history
        id: yahoo-cache
        uses: actions/cache/restore@v4
        with:
          path: momentum5d/data/yahoo
          key: material-breakout-research-${{ github.run_id }}
          restore-keys: |
            momentum5d-final-
            momentum5d-backtest-ready-
            momentum5d-data-ready-
            momentum5d-yahoo-

      - name: Confirm cached market data
        shell: bash
        run: |
          set -euo pipefail
          test -f momentum5d/data/yahoo/processed/equities_daily.parquet
          ls -lh momentum5d/data/yahoo/processed/equities_daily.parquet

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install research dependencies
        run: python -m pip install pandas numpy pyarrow

      - name: Run three-year event study
        run: python research/material_breakout_pullback_3y.py

      - name: Publish research result
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/results/material_breakout_pullback_3y.json research/results/material_breakout_pullback_trades_3y.csv
          if git diff --cached --quiet; then
            echo "Research result unchanged."
            exit 0
          fi
          git commit -m "Add 3y material-breakout pullback results"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
