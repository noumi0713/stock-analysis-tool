name: Material breakout pullback 3Y research

on:
  workflow_dispatch:
  push:
    branches:
      - agent/demand-supply-study
    paths:
      - "research/material_breakout_pullback_3y.py"
      - ".github/workflows/material-breakout-pullback-3y.yml"

permissions:
  contents: write

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      YAHOO_RETENTION_DAYS: "1200"
      YAHOO_OVERLAP_DAYS: "10"
      YAHOO_BATCH_SIZE: "60"
      YAHOO_PAUSE_SECONDS: "1.0"
      YAHOO_MAX_RETRIES: "3"
      YAHOO_TIMEOUT_SECONDS: "30"
    steps:
      - name: Check out research branch
        uses: actions/checkout@v6

      - name: Check out current main universe code
        uses: actions/checkout@v6
        with:
          ref: main
          path: _main

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: momentum5d/pyproject.toml

      - name: Install application and research dependencies
        run: |
          python -m pip install "./momentum5d"
          python -m pip install xlrd

      - name: Build point-in-time TSE universe
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p research/work/universe
          AS_OF="$(TZ=Asia/Tokyo date +%F)"
          HISTORY_START="$(date -u -d "$AS_OF - 1200 days" +%F)"
          PYTHONPATH="$GITHUB_WORKSPACE/_main/momentum5d" \
            python "$GITHUB_WORKSPACE/_main/momentum5d/app/yahoo/universe.py" \
            --config-dir "$GITHUB_WORKSPACE/research/work/universe" \
            --history-start "$HISTORY_START" \
            --as-of "$AS_OF"
          wc -l research/work/universe/historical_tickers.txt

      - name: Download three-plus years of TSE daily data
        shell: bash
        working-directory: momentum5d
        run: |
          set -euo pipefail
          AS_OF="$(TZ=Asia/Tokyo date +%F)"
          python -m app yahoo-ingest \
            --as-of "$AS_OF" \
            --tickers-file ../research/work/universe/historical_tickers.txt
          ls -lh data/yahoo/processed/equities_daily.parquet

      - name: Run three-year event study
        run: python research/material_breakout_pullback_3y.py

      - name: Publish research result
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/results/material_breakout_pullback_3y.json research/results/material_breakout_pullback_trades_3y.csv
          if git diff --cached --quiet; then
            echo "Research result unchanged."
            exit 0
          fi
          git commit -m "Add 3y material-breakout pullback results"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
