name: Freeze pre-08:15 market snapshot

on:
  workflow_dispatch:
  schedule:
    - cron: '5 23 * * 0-4' # 08:05 JST on Monday-Friday

permissions:
  contents: write
  issues: write

concurrency:
  group: morning-0815-snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: swing_data/requirements.txt
      - run: pip install -r swing_data/requirements.txt

      - name: Restore yesterday's 5-minute data if present
        run: |
          if git fetch origin refs/heads/intraday-5m-data:refs/remotes/origin/intraday-5m-data; then
            git show origin/intraday-5m-data:intraday_5m.sqlite > "$RUNNER_TEMP/intraday_5m.sqlite"
            git show origin/intraday-5m-data:intraday_5m_quality.json > "$RUNNER_TEMP/intraday_5m_quality.json" || true
          fi

      - name: Capture information available by 08:15 JST
        run: |
          python -m swing_data.morning_snapshot \
            --db "$RUNNER_TEMP/intraday_5m.sqlite" \
            --quality "$RUNNER_TEMP/intraday_5m_quality.json" \
            --output-dir "$RUNNER_TEMP/morning-snapshots"

      - name: Select provisional fixed-time trades before the cutoff
        run: |
          snapshot_file=$(find "$RUNNER_TEMP/morning-snapshots" -name '*.json' -print -quit 2>/dev/null || true)
          if [ -n "$snapshot_file" ]; then
            python -m swing_data.intraday_selector \
              --snapshot "$snapshot_file" \
              --db "$RUNNER_TEMP/intraday_5m.sqlite" \
              --output-dir "$RUNNER_TEMP/morning-picks"
          fi

      - name: Append frozen record without overwriting a prior day
        id: archive
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          snapshot_file=$(find "$RUNNER_TEMP/morning-snapshots" -name '*.json' -print -quit 2>/dev/null || true)
          if [ -z "$snapshot_file" ]; then
            echo 'No Tokyo trading session today.'
            exit 0
          fi
          archive="$RUNNER_TEMP/morning-snapshot-archive"
          if git fetch origin refs/heads/morning-0815-snapshots:refs/remotes/origin/morning-0815-snapshots; then
            git worktree add --detach "$archive" refs/remotes/origin/morning-0815-snapshots
          else
            mkdir -p "$archive"
            cd "$archive"
            git init -b morning-0815-snapshots
            git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          fi
          relative_path=${snapshot_file#"$RUNNER_TEMP/morning-snapshots/"}
          test ! -e "$archive/$relative_path"
          pick_file="$RUNNER_TEMP/morning-picks/$relative_path"
          test -f "$pick_file"
          test ! -e "$archive/picks/$relative_path"
          mkdir -p "$(dirname "$archive/$relative_path")"
          mkdir -p "$(dirname "$archive/picks/$relative_path")"
          cp "$snapshot_file" "$archive/$relative_path"
          cp "$pick_file" "$archive/picks/$relative_path"
          cd "$archive"
          sha256sum "$relative_path" > "$relative_path.sha256"
          sha256sum "picks/$relative_path" > "picks/$relative_path.sha256"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$relative_path" "$relative_path.sha256" \
            "picks/$relative_path" "picks/$relative_path.sha256"
          git commit -m "Freeze 08:15 snapshot ${relative_path##*/}"
          git -c "http.extraHeader=AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)" \
            push origin HEAD:morning-0815-snapshots

      - name: Notify the repository owner of a frozen forecast or failure
        if: always()
        env:
          GITHUB_TOKEN: ${{ github.token }}
          ARCHIVE_OUTCOME: ${{ steps.archive.outcome }}
        run: |
          trade_date=$(TZ=Asia/Tokyo date +%F)
          pick_args=()
          if [ "$ARCHIVE_OUTCOME" = success ]; then
            pick_file=$(find "$RUNNER_TEMP/morning-picks" -name "${trade_date}.json" -print -quit 2>/dev/null || true)
            snapshot_file=$(find "$RUNNER_TEMP/morning-snapshots" -name "${trade_date}.json" -print -quit 2>/dev/null || true)
            if [ -n "$pick_file" ] && [ -n "$snapshot_file" ]; then
              pick_args=(--picks "$pick_file" --snapshot "$snapshot_file")
            fi
          fi
          python -m swing_data.intraday_notice --trade-date "$trade_date" "${pick_args[@]}"

      - name: Upload diagnostic artifact if archive fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: morning-snapshot-failed-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/morning-snapshots/
            ${{ runner.temp }}/morning-picks/
          if-no-files-found: ignore
