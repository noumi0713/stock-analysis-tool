name: 日本株120営業日データ更新

on:
  workflow_dispatch:
  schedule:
    # Every day at 17:00 JST (08:00 UTC), including weekends and holidays.
    - cron: '0 8 * * *'
    # Recover a missed or failed publish at 20:17 and 07:37 JST.
    - cron: '17 11 * * *'
    - cron: '37 22 * * *'
  push:
    branches: [main]
    paths:
      - 'swing_data/**'
      - 'tests/swing_data/**'

permissions:
  contents: write

concurrency:
  group: swing-data-publication
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: swing_data/requirements.txt
      - run: python -m pip install -r swing_data/requirements.txt pytest
      - name: Verify collector contracts
        run: python -m pytest tests/swing_data -q
      - name: Restore published data without touching code branches
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git ls-remote --exit-code --heads origin swing-data-120d-latest; then
            git fetch origin swing-data-120d-latest
            git worktree add --detach public-data FETCH_HEAD
          else
            mkdir public-data
            cd public-data
            git init -b swing-data-120d-latest
            git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          fi
          mkdir -p swing_data/runtime
          if [ -f public-data/universe.csv ] && [ -f public-data/manifest.json ]; then
            cp public-data/universe.csv swing_data/runtime/universe_cache.csv
            python -c 'import json,pathlib; p=pathlib.Path("swing_data/runtime/universe_cache.json"); p.write_text(json.dumps(json.load(open("public-data/manifest.json")).get("universe",{})))'
          fi
      - name: Check for missed daily update
        id: freshness
        if: github.event_name == 'schedule' && github.event.schedule != '0 8 * * *'
        run: |
          python - <<'PYTHON'
          import os
          from datetime import datetime
          from pathlib import Path

          from swing_data.collector import JST, read_json, session_window

          expected = session_window(datetime.now(JST))[-1]
          try:
              status = read_json(Path("public-data/bollinger_minus2_status.json"))
          except (OSError, ValueError):
              status = {}
          fresh = (
              status.get("expected_date") == expected
              and status.get("source_date") == expected
              and status.get("status") in {"success", "partial"}
              and status.get("evaluated_count", 0) > 0
          )
          message = f"Expected XTKS session {expected}; published {status.get('source_date')}; status {status.get('status')}"
          print(message if fresh else f"::warning::Daily watchlist missing or failed. Recovering. {message}")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
              summary.write(message + (" (up to date)" if fresh else " (recovery started)") + "\n")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"fresh={str(fresh).lower()}\n")
          PYTHON
      - name: Fetch completed sessions
        id: collect
        if: steps.freshness.outputs.fresh != 'true'
        continue-on-error: true
        env:
          PYTHONUNBUFFERED: '1'
        run: python -m swing_data.collector
      - name: Prepare readable site data and failure status
        id: prepare
        if: always() && (steps.collect.outcome == 'success' || steps.collect.outcome == 'failure')
        run: python -m swing_data.publish --source swing_data/runtime --target public-data
      - name: Show daily Bollinger minus-two-sigma watchlist
        if: always() && (steps.collect.outcome == 'success' || steps.collect.outcome == 'failure')
        run: |
          if [ -f public-data/bollinger_minus2.md ]; then
            cat public-data/bollinger_minus2.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Collect top-100 market consensus
        id: consensus
        if: always() && (steps.collect.outcome == 'success' || steps.collect.outcome == 'failure')
        continue-on-error: true
        env:
          PYTHONUNBUFFERED: '1'
        run: python -m swing_data.market_consensus --target public-data
      - name: Install PDF text reader
        if: steps.prepare.outcome == 'success'
        continue-on-error: true
        run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils
      - name: Collect supply, events, capital and EPS observations
        id: supplemental
        if: always() && (steps.collect.outcome == 'success' || steps.collect.outcome == 'failure')
        continue-on-error: true
        env:
          PYTHONUNBUFFERED: '1'
        run: python -m swing_data.supplemental --target public-data
      - name: Publish latest-only data snapshot
        if: steps.prepare.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd public-data
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          published_ref=$(git rev-parse --verify HEAD 2>/dev/null || true)
          git checkout --orphan latest-snapshot
          git rm -rf --cached . >/dev/null 2>&1 || true
          git add --all
          git commit -m 'Publish latest 120-session data snapshot'
          git -c "http.extraHeader=AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)" push --force-with-lease="refs/heads/swing-data-120d-latest:$published_ref" origin HEAD:swing-data-120d-latest
          published_at=$(TZ=Asia/Tokyo date --iso-8601=seconds)
          printf '\nGitHub publish completed (JST): %s\n' "$published_at" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Retain run evidence
        if: always() && steps.collect.outcome != 'skipped'
        uses: actions/upload-artifact@v4
        with:
          name: swing-120d-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: swing_data/runtime/
          retention-days: 30
          if-no-files-found: warn
      - name: Mark failed supplemental execution
        if: steps.supplemental.outcome == 'failure'
        run: exit 1
      - name: Mark failed market consensus execution
        if: steps.consensus.outcome == 'failure'
        run: exit 1
      - name: Mark failed collection
        if: always() && steps.collect.outcome == 'failure'
        run: |
          cat swing_data/runtime/status.json
          echo "::error::Equity or required market data failed validation. See the run artifact for per-ticker diagnostics."
          exit 1
