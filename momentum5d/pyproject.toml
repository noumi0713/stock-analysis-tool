[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "japan-stock-signal-data"
version = "0.1.0"
description = "yfinanceを利用した日本株短期上昇シグナル分析基盤"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "duckdb>=1.2,<2",
  "pandas>=2.2,<3",
  "pyarrow>=18,<22",
  "python-dotenv>=1.0,<2",
  "requests>=2.32,<3",
  "scikit-learn>=1.5,<2",
  "xlrd>=2.0,<3",
  "yfinance>=1.5.1,<2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "pytest-cov>=6,<8",
  "responses>=0.25,<1",
  "ruff>=0.9,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
